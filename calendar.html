<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 4 - Calendar</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./resources/css/style.css">
    <script src="./resources/js/script.js"></script>
  </head>
  <body class="calendar">
    <div class="row">
        <div class="col-2">
            <div class="custom-container">
                <button class="btn btn-primary mt-3" type="button" data-bs-toggle="modal" data-bs-target="#event_modal">Create Event</button>
            </div>
        </div>
        <div class="col">
            <div class="container-md container-fluid py-4 h-100">
                <div id="calendar" class="row h-100">
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="sunday">
                        <div class="h6 text-center position-relative py-2 day">
                            Sunday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="monday">
                        <div class="h6 text-center position-relative py-2 day">
                            Monday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="tuesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Tuesday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="wednesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Wednesday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="thursday">
                        <div class="h6 text-center position-relative py-2 day">
                            Thursday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="friday">
                        <div class="h6 text-center position-relative py-2 day">
                            Friday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="saturday">
                        <div class="h6 text-center position-relative py-2 day">
                            Saturday
                        </div>
                    </div>
                </div>        
            </div>
        </div>
    </div> 
</body>

<!-- Modal -->
<div class="modal fade" id="event_modal" tabindex="-1" aria-labelledby="eventCreationModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5 calendar" id="eventCreationModal">Create Event</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!--Form-->
        <form id="event_form" class="needs-validation" novalidate>
            <div class="form-group">
                <label for="event_name">Event Name</label>
                <input type="text" class="form-control form-control-lg" id="event_name" placeholder="Event Name" required>
                <div class="invalid-feedback">
                    Please enter a name for the event.
                </div>
            </div>
            <div class="form-group">
                <label for="category">Select Category</label>
                <select class="form-control" id="category">
                    <option value="academic">Academic</option>
                    <option value="work">Work</option>
                    <option value="personal">Personal</option>
                    <option value="social">Social</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 8px;">
                <label for="event_weekday">Select Day</label>
                <select class="form-control" id="event_weekday">
                    <option value="monday">Monday</option>
                    <option value="tuesday">Tuesday</option>
                    <option value="wednesday">Wednesday</option>
                    <option value="thursday">Thursday</option>
                    <option value="friday">Friday</option>
                    <option value="saturday">Saturday</option>
                    <option value="sunday">Sunday</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="event_time">Select Time</label>
                <input type="time" id="event_time">
            </div>
            <div class="form-group">
                <label for="event_modality" style="margin-top:5px">Modality</label>
                <select class="form-control" id="event_modality" onchange="updateLocationOptions(this);">
                    <option value="in-person">in-person</option>
                    <option value="remote">remote</option>
                </select>
            </div>
            <div class="form-group" id="in_person">
                <label for="event_location">Location:</label>
                <input type="text" class="form-control" id="event_location" required>
                <div class="invalid-feedback">
                    Please enter a location.
                </div>
            </div>
            <div class="form-group" id="remote" style="display: none;">
                <label for="event_remote_url">URL:</label>
                <input type="text" class="form-control" id="event_remote_url" placeholder="https://zoom.us/join" pattern="^https:\/\/[0-9A-Za-z]+$" required>
                <div class="invalid-feedback">
                    Please enter a URL.
                </div>
            </div>
            <div class="form-group">
                <label for="event_attendees">Attendees</label>
                <input type="text" class="form-control" id="event_attendees">
            </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary" onclick="saveEvent()">Save Event</button>
      </div>
    </div>
  </div>
</div>
</html>
